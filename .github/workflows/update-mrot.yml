name: Update MROT automatically

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check official MROT
        run: python3 scripts/update_mrot.py
      - name: Commit changed MROT data
        run: |
          if git diff --quiet data/mrot.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "8mrot updater"
          git config user.email "actions@users.noreply.github.com"
          git add data/mrot.json
          git commit -m "Auto-update official MROT"
          git push
